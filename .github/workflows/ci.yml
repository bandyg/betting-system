name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# cancel in-progress runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (bhs-4-style)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build apps/api
        run: pnpm --filter api build

      - name: Build apps/web
        run: pnpm --filter web build

      # ── 隔离 API + 11 个后端 verify 脚本 ──
      - name: Run API e2e
        env:
          BETTING_DB_PATH: /tmp/ci-betting.db
          PORT: '14100'
          NODE_ENV: test
        run: |
          node apps/api/dist/index.js &
          API_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:14100/health
          python3 scripts/verify_accounts.py    http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_matches.py     http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_markets.py     http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_withdrawals.py http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_cms.py          http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_crm_risk.py     http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_analytics.py    http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_parlay.py       http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_support.py      http://127.0.0.1:14100/api /tmp/ci-betting.db
          python3 scripts/verify_vip.py          http://127.0.0.1:14100/api /tmp/ci-betting.db
          kill $API_PID
          rm -f /tmp/ci-betting.db

      # ── 健康检查 ──
      - name: Run health e2e
        env:
          BETTING_DB_PATH: /tmp/ci-betting.db
          PORT: '14100'
          NODE_ENV: test
        run: |
          node apps/api/dist/index.js &
          API_PID=$!
          sleep 2
          BASE=http://127.0.0.1:14100 node scripts/verify_health.mjs
          kill $API_PID
          rm -f /tmp/ci-betting.db

      # ── UI e2e（playwright 隔离 second vite preview :14200）──
      - name: Install Playwright browser
        run: |
          pnpm --filter web exec playwright install --with-deps chromium || true
          npx playwright install --with-deps chromium

      - name: Run UI e2e
        env:
          BETTING_DB_PATH: /tmp/ci-ui.db
          PORT_API: '14100'
          PORT_WEB: '14200'
          NODE_ENV: test
          PW_DIR: ${{ github.workspace }}/.cache/ms-playwright
        run: |
          # 起 second API
          PORT=$PORT_API node apps/api/dist/index.js &
          API_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:$PORT_API/health
          # 起 second vite preview
          (cd apps/web && npx vite preview --port $PORT_WEB --host 0.0.0.0) &
          WEB_PID=$!
          sleep 5
          # 等 chromium 装好（上面 step）
          ls -la "$PW_DIR" 2>/dev/null || echo "PW_DIR empty, will fallback"
          # 跑 3 个 UI 脚本
          node scripts/verify_k_ux.mjs http://127.0.0.1:$PORT_WEB http://127.0.0.1:$PORT_API/api || true
          node scripts/verify_l_ux.mjs http://127.0.0.1:$PORT_WEB http://127.0.0.1:$PORT_API/api || true
          node scripts/verify_m_ux.mjs http://127.0.0.1:$PORT_WEB http://127.0.0.1:$PORT_API/api || true
          kill $API_PID $WEB_PID 2>/dev/null
          rm -f /tmp/ci-ui.db

      # ── 单元测试 (Sprint 5 C7) ──
      - name: Run unit tests
        run: node scripts/run_unit_tests.mjs

      # ── 视觉回归 (Sprint 5 扩展) ──
      # 必须先跑: db 干净 + 仅 1 个 VRLeague match
      - name: Visual regression
        env:
          BETTING_DB_PATH: /tmp/ci-visual.db
          PORT_API: '14101'
          PORT_WEB: '14201'
          NODE_ENV: test
          PW_DIR: ${{ github.workspace }}/.cache/ms-playwright
        run: |
          # 起 API (fresh db)
          PORT=$PORT_API node apps/api/dist/index.js &
          API_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:$PORT_API/health
          # 起 vite preview
          (cd apps/web && npx vite preview --port $PORT_WEB --host 0.0.0.0) &
          WEB_PID=$!
          sleep 5
          # 跑 visual regression (8 页对比 baseline, idempotent seed 复用 VRLeague)
          node scripts/visual_regression.mjs
          RESULT=$?
          kill $API_PID $WEB_PID 2>/dev/null
          rm -f /tmp/ci-visual.db
          exit $RESULT

      # ── WebSocket 端到端 (Sprint 4 C3) ──
      - name: WebSocket real-time odds
        env:
          BETTING_DB_PATH: /tmp/ci-ws.db
          PORT_API: '14102'
          NODE_ENV: test
        run: |
          PORT=$PORT_API node apps/api/dist/index.js &
          API_PID=$!
          sleep 2
          # 跑 ws e2e: create match+market → admin 调赔 → ws client 收 odds_batch
          PORT=$PORT_API node scripts/verify_websocket.mjs
          RESULT=$?
          kill $API_PID 2>/dev/null
          rm -f /tmp/ci-ws.db
          exit $RESULT

      # ── 汇总 ──
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ CI failed on ${{ github.ref }}"
          echo "::error::Check above logs"
