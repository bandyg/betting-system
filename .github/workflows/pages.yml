name: pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/storybook/**'
      - 'docs/visual-baseline/**'
      - 'docs/index.template.html'
      - 'scripts/build_pages.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 注意：不可加 administration:write —— 不是 GITHUB_TOKEN 合法權限鍵，
  # workflow schema validator 會拒整個檔案（0 jobs startup failure，實測 bda729d）。
  # enablement:true 若 403（GITHUB_TOKEN 無權啟用 Pages），改 repo Settings → Pages 手動啟用一次。

# cancel in-progress runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # enablement=true: 首次跑自動啟用 repo Pages（此前 repo 從未啟用 → /pages REST 404）
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Pages artifact
        # 统一构建：落地页 + storybook（md → html，修复死链）+ 基线图
        run: bash scripts/build_pages.sh _pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
